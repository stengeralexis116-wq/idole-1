<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IDOLE 1 — Test</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#263c52;color:white;font:14px system-ui}canvas{display:block;touch-action:none}header{position:absolute;top:0;left:0;right:0;text-align:center;padding:12px;background:#14253bdd;pointer-events:none}h1{font-size:22px;margin:0}#hud{font-size:12px;margin-top:6px}#hint{position:absolute;top:90px;left:10%;right:10%;text-align:center;pointer-events:none;font-size:12px}nav{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;max-width:98vw;overflow:auto;white-space:nowrap;background:#14253bdd;padding:7px;border-radius:15px}button{color:white;background:#2a405a;border:1px solid #99b5cc66;border-radius:11px;min-height:44px;padding:10px;font:12px system-ui}#zoom{position:absolute;right:10px;bottom:90px;display:grid;gap:5px}</style></head><body><header><h1>IDOLE 1 · Restaurant × Aliens</h1><div id="hud"></div></header><div id="hint">Chargement 3D… Utilise le paysage.</div><nav><button id="table">Table</button><button id="trap">Piège</button><button id="weapon">Arme</button><button id="repair">Réparer</button><button id="cancel">Annuler</button><button id="export">Sauvegarde JSON</button></nav><div id="zoom"><button id="plus">＋</button><button id="minus">−</button></div><script>setTimeout(()=>{if(!document.querySelector('canvas'))document.getElementById('hint').textContent='Chargement échoué : vérifie Internet et recharge Safari.';},15000);</script><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=id=>document.getElementById(id),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function fresh(){return{version:1,coins:130,hp:200,weapon:1,tables:[{x:0,z:0,hp:80,phase:0}],traps:[],aliens:[],wave:0,wait:16,nextId:1,savedAt:Date.now()};}
let S;try{const s=JSON.parse(localStorage.getItem('idole1.first'));if(s&&s.version===1&&Number.isFinite(s.coins)&&s.coins>=0&&Number.isFinite(s.hp)&&s.hp>=0&&s.hp<=200&&Number.isInteger(s.weapon)&&s.weapon>0&&Array.isArray(s.tables)&&s.tables.length>0&&s.tables.length<=100&&Array.isArray(s.traps)&&s.traps.length<=100&&Array.isArray(s.aliens)&&s.aliens.length<=28&&Number.isFinite(s.savedAt))S=s;}catch{}S??=fresh();
const income=()=>S.hp>0?S.tables.filter(t=>t.hp>0).length*.5:0;function offline(){const n=Math.floor(clamp((Date.now()-S.savedAt)/1000,0,14400)*income()*.6);S.coins+=n;S.savedAt=Date.now();return n;}const bonus=offline();function note(s){$('hint').textContent=s;}function save(){S.savedAt=Date.now();try{localStorage.setItem('idole1.first',JSON.stringify(S));}catch{note('Stockage bloqué : exporte ta sauvegarde.');}}
const scene=new T.Scene();scene.background=new T.Color(0x263c52);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(renderer.domElement);const camera=new T.OrthographicCamera(-16,16,10,-10,.1,100);let size=10;function resize(){renderer.setSize(innerWidth,innerHeight);camera.left=-size*innerWidth/innerHeight;camera.right=-camera.left;camera.top=size;camera.bottom=-size;camera.position.set(18,22,18);camera.lookAt(0,0,0);camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();scene.add(new T.HemisphereLight(0xffebcd,0x506e91,2.2));const sun=new T.DirectionalLight(0xffd09a,3);sun.position.set(-7,18,10);scene.add(sun);
const materials=new Map(),geometries=new Map();function mesh(type,args,color,x,y,z,g=scene){const key=type+JSON.stringify(args);if(!geometries.has(key))geometries.set(key,new T[type](...args));if(!materials.has(color))materials.set(color,new T.MeshStandardMaterial({color,roughness:.8}));const m=new T.Mesh(geometries.get(key),materials.get(color));m.position.set(x,y,z);g.add(m);return m;}const box=(w,h,d,c,x,y,z,g)=>mesh('BoxGeometry',[w,h,d],c,x,y,z,g),ball=(r,c,x,y,z,g)=>mesh('SphereGeometry',[r,12,8],c,x,y,z,g),cyl=(r,h,c,x,y,z,g)=>mesh('CylinderGeometry',[r,r,h,12],c,x,y,z,g);
box(14,.5,14,0x537e69,0,-.4,0);box(12,.2,12,0xc8b08a,0,-.1,0);box(12,.5,.25,0x926341,0,.25,-6);box(4.8,1.2,1.4,0x776b68,0,.6,-4.6);box(5,.15,1.5,0xe7c99b,0,1.25,-4.6);ball(.4,0xff9933,-1,1.6,-4.6);
function person(alien){const g=new T.Group();box(.55,.7,.4,alien?0x864eb0:0x44a9bf,0,.9,0,g);ball(alien?.36:.28,alien?0x99df77:0xffcfa8,0,1.5,0,g);for(const a of [-1,1]){box(.18,.5,.2,0x46405a,a*.16,.3,0,g);ball(.075,0xffffff,a*.12,1.53,.28,g);ball(.035,0x252537,a*.12,1.53,.34,g);if(alien)cyl(.045,.4,0x99df77,a*.23,1.9,0,g);}scene.add(g);return g;}const chef=person(false);chef.position.set(1.7,0,-5.7);
function bar(g,y){box(1,.08,.1,0x522a42,0,y,0,g);const fill=box(1,.09,.11,0x9de6a8,0,y,0,g);return fill;}const kitchenLife=new T.Group();scene.add(kitchenLife);kitchenLife.position.set(0,2.2,-4.6);const kitchenBar=bar(kitchenLife,0);
const tableModels=[],trapModels=[],alienModels=new Map();function ensure(){while(tableModels.length<S.tables.length){const g=new T.Group();scene.add(g);cyl(.86,.16,0xb77b48,0,1.05,0,g);cyl(.17,1,0x684b38,0,.5,0,g);cyl(.25,.03,0xffedcc,0,1.16,0,g);box(.5,.5,.5,0x946845,1.15,.25,0,g);tableModels.push({g,client:person(false),bar:bar(g,1.65)});}while(trapModels.length<S.traps.length){const g=new T.Group();scene.add(g);cyl(.95,.12,0x664936,0,.06,0,g);cyl(.8,.12,0x292736,0,.13,0,g);for(let i=0;i<8;i++){const a=i/8*Math.PI*2;mesh('ConeGeometry',[.1,.5,6],0xebd7ae,Math.cos(a)*.6,.4,Math.sin(a)*.6,g);}trapModels.push(g);}for(const a of S.aliens)if(!alienModels.has(a.id)){const g=person(true);alienModels.set(a.id,{g,bar:bar(g,2.35),flash:0});}const ids=new Set(S.aliens.map(a=>a.id));for(const [id,m]of alienModels)if(!ids.has(id)){scene.remove(m.g);alienModels.delete(id);}}
let mode=null;function setMode(m){mode=m;note(m?'Touche une case libre pour placer '+(m==='table'?'une table.':'un piège.'):'Touche les aliens pour attaquer. Toucher un piège améliore ses dégâts.');}const tablePrice=()=>Math.round(45*1.32**(S.tables.length-1)),trapPrice=()=>Math.round(65*1.2**S.traps.length);function spend(n){if(S.coins<n)return false;S.coins-=n;return true;}
const ray=new T.Raycaster(),plane=new T.Plane(new T.Vector3(0,1,0),0);function click(x,y){ray.setFromCamera(new T.Vector2(x/innerWidth*2-1,1-y/innerHeight*2),camera);const p=ray.ray.intersectPlane(plane,new T.Vector3());if(!p)return;if(mode){const px=Math.round(p.x),pz=Math.round(p.z),ok=Math.abs(px)<=5&&pz>=-3&&pz<=5&&[...S.tables,...S.traps].every(t=>Math.hypot(t.x-px,t.z-pz)>=1.8);if(!ok||!spend(mode==='table'?tablePrice():trapPrice())){note('Case invalide ou pièces insuffisantes');return;}(mode==='table'?S.tables:S.traps).push(mode==='table'?{x:px,z:pz,hp:80,phase:0}:{x:px,z:pz,level:1,cooldown:0});setMode(null);save();return;}let a=null,best=Infinity;for(const v of S.aliens){const q=new T.Vector3(v.x,1.5,v.z).project(camera),d=Math.hypot(x-(q.x*.5+.5)*innerWidth,y-(-q.y*.5+.5)*innerHeight);if(d<48&&d<best){a=v;best=d;}}if(a){const damage=12*S.weapon*(Math.random()<.15?2:1);a.hp-=damage;note('−'+damage+' dégâts');const m=alienModels.get(a.id);if(m)m.flash=.18;return;}const t=S.traps.find(t=>Math.hypot(t.x-p.x,t.z-p.z)<1.2);if(t){const cost=Math.round(45*1.6**(t.level-1));if(t.level<100&&spend(cost)){t.level++;save();note('Piège niveau '+t.level);}else note('Amélioration : '+cost+' pièces');}}
let start;renderer.domElement.onpointerdown=e=>{e.preventDefault();start={x:e.clientX,y:e.clientY};};renderer.domElement.onpointerup=e=>{if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)<18)click(e.clientX,e.clientY);start=null;};renderer.domElement.onpointercancel=()=>start=null;
$('table').onclick=()=>setMode('table');$('trap').onclick=()=>setMode('trap');$('cancel').onclick=()=>setMode(null);$('weapon').onclick=()=>{const n=Math.round(60*1.7**(S.weapon-1));if(S.weapon<100&&spend(n)){S.weapon++;save();note('Arme améliorée');}else note('Arme : '+n+' pièces');};$('repair').onclick=()=>{if(S.hp<=0&&S.coins<20){S.hp=50;note('Restaurant relancé');}else if(spend(20)){S.hp=Math.min(200,S.hp+100);S.tables.forEach(t=>t.hp=80);note('Restaurant réparé');}else note('Réparation : 20 pièces');save();};$('plus').onclick=()=>{size=clamp(size-1.2,5,20);resize();};$('minus').onclick=()=>{size=clamp(size+1.2,5,20);resize();};$('export').onclick=()=>{save();const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='idole1-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);};
function tick(dt){if(S.hp>0)for(const t of S.tables){if(t.hp<=0)continue;const before=t.phase;t.phase+=dt;if(before<6&&t.phase>=6)S.coins+=4;if(t.phase>=8)t.phase-=8;}S.wait=Math.max(0,S.wait-dt);if(S.wait===0&&S.aliens.length===0){S.wave++;for(let i=0;i<Math.min(28,3+S.wave);i++){const a=Math.random()*Math.PI*2,hp=36+S.wave*5;S.aliens.push({id:S.nextId++,x:Math.cos(a)*9,z:Math.sin(a)*9,hp,maxHp:hp,attack:0,slow:0});}S.wait=22;note('Invasion ! Vague '+S.wave);}for(const a of S.aliens){if(a.hp<=0)continue;a.attack=Math.max(0,a.attack-dt);a.slow=Math.max(0,a.slow-dt);const target=S.tables.filter(t=>t.hp>0).sort((p,q)=>Math.hypot(p.x-a.x,p.z-a.z)-Math.hypot(q.x-a.x,q.z-a.z))[0],tx=target?target.x:0,tz=target?target.z:-4.6,dx=tx-a.x,dz=tz-a.z,d=Math.hypot(dx,dz);if(d>1.25){const step=Math.min(d-1.25,dt*(a.slow>0?.45:1.1));a.x+=dx/d*step;a.z+=dz/d*step;}else if(a.attack===0){if(target)target.hp=Math.max(0,target.hp-6);else S.hp=Math.max(0,S.hp-6);a.attack=1.2;}}for(const t of S.traps){t.cooldown=Math.max(0,t.cooldown-dt);if(t.cooldown===0){const targets=S.aliens.filter(a=>a.hp>0&&Math.hypot(a.x-t.x,a.z-t.z)<2.65);if(targets.length){for(const a of targets){a.hp-=18*t.level;a.slow=1.6;}t.cooldown=2.4;}}}S.aliens=S.aliens.filter(a=>{if(a.hp>0)return true;S.coins+=12;return false;});}
let last=performance.now(),time=0,saveClock=0,hidden=false;document.addEventListener('visibilitychange',()=>{if(document.hidden){save();hidden=true;}else{if(hidden){note('Revenus hors ligne : +'+offline());save();hidden=false;}last=performance.now();}});addEventListener('pagehide',save);function frame(now){requestAnimationFrame(frame);const dt=clamp((now-last)/1000,0,.1);last=now;if(document.hidden)return;time+=dt;tick(dt);ensure();saveClock+=dt;if(saveClock>=8){save();saveClock=0;}S.tables.forEach((t,i)=>{const m=tableModels[i];m.g.position.set(t.x,0,t.z);m.bar.scale.x=t.hp/80;m.client.visible=t.hp>0&&S.hp>0;let z=t.z;if(t.phase<2)z=8+(t.z-8)*t.phase/2;else if(t.phase>=6)z=t.z+(8-t.z)*(t.phase-6)/2;m.client.position.set(t.x+1.2,Math.sin(time*8)*.025,z);m.client.rotation.y=t.phase<2?Math.PI:t.phase<6?-Math.PI/2:0;});S.traps.forEach((t,i)=>trapModels[i].position.set(t.x,0,t.z));for(const a of S.aliens){const m=alienModels.get(a.id);m.flash=Math.max(0,m.flash-dt);m.g.position.set(a.x,Math.abs(Math.sin(time*7+a.id))*.05,a.z);m.g.rotation.y=Math.atan2(-a.x,-a.z);m.g.scale.setScalar(m.flash>0?1.1:1);m.bar.scale.x=Math.max(0,a.hp/a.maxHp);}kitchenBar.scale.x=S.hp/200;$('hud').textContent=`🪙 ${Math.floor(S.coins)} · +${income().toFixed(1)}/s · ♥ ${Math.ceil(S.hp)}/200 · Vague ${S.wave} · Préhistorique`;$('table').textContent='Table · '+tablePrice();$('trap').textContent='Piège · '+trapPrice();renderer.render(scene,camera);}
save();ensure();setMode(null);if(bonus)note('Bon retour : +'+bonus+' pièces');requestAnimationFrame(frame);
</script></body></html>
